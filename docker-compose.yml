# Local Postgres + pgvector for underwriting RAG (policy corpus).
# Multi-tenant lender DBs will layer on later (schemas / DATABASE_URL per tenant).
#
#   docker compose up -d postgres
#   # wait until healthy, then:
#   uv run underwriting-rag-ingest
#
# Optional API container (needs a filled .env with keys as required):
#   docker compose --profile api up -d --build api

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: underwriting-postgres
    environment:
      POSTGRES_USER: underwriting
      POSTGRES_PASSWORD: underwriting
      POSTGRES_DB: underwriting_db
    ports:
      # Host 54326 avoids clashing with a local Postgres or the boilerplate RAG stack (54325).
      - "54326:5432"
    volumes:
      - underwriting_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriting -d underwriting_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build: .
    container_name: underwriting-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      API_RELOAD: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      BRAINTRUST_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  underwriting_pgdata:
