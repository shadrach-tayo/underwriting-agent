# Local Postgres + pgvector for underwriting RAG (policy corpus).
# Multi-tenant lender DBs will layer on later (schemas / DATABASE_URL per tenant).
#
#   docker compose up -d postgres
#   # wait until healthy, then:
#   uv run underwriting-rag-ingest
#
# Optional API container (needs a filled .env with keys as required):
#   docker compose --profile api up -d --build api
#
# Prometheus + Grafana (does not start the API; scrapes host :8080):
#   docker compose --profile observability up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: underwriting-postgres
    environment:
      POSTGRES_USER: underwriting
      POSTGRES_PASSWORD: underwriting
      POSTGRES_DB: underwriting_db
    ports:
      # Host 54326 avoids clashing with a local Postgres or the boilerplate RAG stack (54325).
      - "54326:5432"
    volumes:
      - underwriting_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriting -d underwriting_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build: .
    container_name: underwriting-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      API_RELOAD: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      BRAINTRUST_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: underwriting-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    container_name: underwriting-grafana
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - underwriting_grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  underwriting_pgdata:
  underwriting_grafana:
