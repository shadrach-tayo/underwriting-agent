[project]
name = "underwriting-agent"
version = "0.1.0"
description = "Agentic SME underwriting decision & escalation system with a hard-coded risk ceiling"
readme = "README.md"
authors = [
    { name = "Shadrach Oloyede", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "agent",
    "claude-agent-sdk>=0.2.124",
    "deepeval>=4.1.2",
    "fastapi>=0.139.2",
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.5.0",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.9",
    "langsmith>=0.10.9",
    "pgvector>=0.2.5,<0.4",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
underwriting-agent = "underwriting_agent:main"
underwriting-rag-ingest = "underwriting_agent.rag.ingest:main"
underwriting-api = "underwriting_agent.api:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-api>=0.11.0",
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["underwriting_agent"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["src"]

[tool.uv.sources]
agent = { git = "ssh://git@github.com/shadrach-tayo/ai-engineering-boilerplate.git", rev = "eval" }
